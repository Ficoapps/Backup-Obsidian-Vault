name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Obsidian-Vault-Backup" "ObsidianVaultBackup.pyw"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Obsidian-Vault-Backup-Windows
          path: dist/Obsidian-Vault-Backup.exe
          if-no-files-found: error
