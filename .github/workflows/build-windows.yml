name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Obsidian-Vault-Backup" "ObsidianVaultBackup.pyw"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obsidian-Vault-Backup-Windows
          path: dist/Obsidian-Vault-Backup.exe
          if-no-files-found: error

      - name: Create v1.0.0 release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.0 "dist/Obsidian-Vault-Backup.exe#Obsidian-Vault-Backup.exe" --target "${{ github.sha }}" --title "Obsidian Vault Backup v1.0.0" --notes "Prima release pubblica di Obsidian Vault Backup. Include backup Vault verso cartella, ripristino Backup verso Vault, salvataggio dei percorsi, barra di avanzamento, log, annullamento operazione, conferma di sicurezza per il ripristino e build Windows standalone."
          }
