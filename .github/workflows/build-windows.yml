name: Build Windows Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build Windows app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --noupx --version-file "version_info.txt" --manifest "app.manifest" --name "Obsidian-Vault-Backup" "ObsidianVaultBackup.pyw"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Obsidian-Vault-Backup/*" -DestinationPath "dist/Obsidian-Vault-Backup-v1.0.1-Windows.zip" -CompressionLevel Optimal

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/Obsidian-Vault-Backup-v1.0.1-Windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  Obsidian-Vault-Backup-v1.0.1-Windows.zip" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obsidian-Vault-Backup-v1.0.1-Windows
          path: |
            dist/Obsidian-Vault-Backup-v1.0.1-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create v1.0.1 release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.1 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.1 "dist/Obsidian-Vault-Backup-v1.0.1-Windows.zip#Obsidian-Vault-Backup-v1.0.1-Windows.zip" "dist/SHA256SUMS.txt#SHA256SUMS.txt" --target "${{ github.sha }}" --title "Obsidian Vault Backup v1.0.1" --notes "Windows 11 compatibility release. Replaces the self-extracting one-file executable with a portable onedir ZIP, adds a Windows application manifest, product/version metadata, disables UPX, and includes a SHA-256 checksum. This packaging is less likely to trigger antivirus heuristic detections. SmartScreen reputation warnings can still occur until the application is digitally signed or gains reputation."
          }
